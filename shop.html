<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>SB Store – Affiliate Best offers and Deals</title>
    
    <!-- Preconnect for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- noUiSlider -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css">
    
    <!-- Toastr -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    
    <style>
        /* ========== ALL YOUR EXISTING CSS STYLES GO HERE ========== */
        /* (Keep all your CSS exactly as it was - I'm showing a condensed version for brevity) */
        
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #3F2B96 0%, #4a35b0 100%);
            color: #1e293b;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        :root {
            --primary-600: #6b4aff;
            --primary-700: #5a3ef0;
            --primary-800: #4a33cc;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --success-500: #22c55e;
            --danger-500: #ef4444;
            --gold-500: #f59e0b;
            --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);
            --radius-lg: 0.5rem;
            --radius-xl: 0.75rem;
            --radius-2xl: 1rem;
            --radius-full: 9999px;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-16: 4rem;
            --text-sm: 0.875rem;
            --text-base: 1rem;
            --text-lg: 1.125rem;
            --text-xl: 1.25rem;
            --text-2xl: 1.5rem;
            --text-3xl: 1.875rem;
            --text-4xl: 2.25rem;
            --text-5xl: 3rem;
            --font-semibold: 600;
            --font-bold: 700;
            --z-sticky: 1020;
            --z-modal: 1050;
            --transition-all: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 var(--space-4);
        }
        
        @media (min-width: 640px) { .container { padding: 0 var(--space-6); } }
        @media (min-width: 1024px) { .container { padding: 0 var(--space-8); } }

        /* Header Styles */
        .site-header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(126,94,255,0.1);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: var(--z-sticky);
        }
        
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 80px;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-600), var(--primary-800));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        
        .nav-menu { display: flex; gap: 2.5rem; }
        
        .nav-link {
            color: var(--gray-700);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition-colors);
            position: relative;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, var(--primary-600), var(--primary-800));
            transition: width 0.3s;
        }
        
        .nav-link:hover { color: var(--primary-700); }
        .nav-link:hover::after,
        .nav-link.active::after { width: 100%; }
        .nav-link.active { color: var(--primary-700); }
        
        .header-actions { display: flex; gap: 1rem; }
        
        .header-action-btn {
            position: relative;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--gray-700);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: var(--radius-full);
            transition: var(--transition-all);
        }
        
        .header-action-btn:hover { color: var(--primary-600); background: var(--primary-100); }
        
        .action-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            min-width: 20px;
            height: 20px;
            background: var(--danger-500);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-full);
            padding: 0 4px;
        }
        
        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        /* Page Header */
        .page-header {
            background: linear-gradient(135deg, var(--primary-800), var(--primary-600));
            padding: var(--space-16) 0;
            text-align: center;
            color: white;
        }
        
        .page-header h1 {
            font-size: var(--text-5xl);
            color: white;
            margin-bottom: var(--space-4);
        }
        
        /* Shop Section */
        .shop-section { padding: var(--space-16) 0; background: var(--gray-50); }
        
        .shop-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: var(--space-8);
        }
        
        .shop-sidebar {
            background: white;
            border-radius: var(--radius-2xl);
            padding: var(--space-6);
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 100px;
            height: fit-content;
        }
        
        .filter-card {
            margin-bottom: var(--space-6);
            border-bottom: 1px solid var(--gray-200);
            padding-bottom: var(--space-6);
        }
        
        .filter-card:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .filter-card h3 {
            font-size: var(--text-lg);
            font-weight: var(--font-semibold);
            margin-bottom: var(--space-4);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            color: var(--gray-800);
        }
        
        .filter-card h3 i { color: var(--primary-500); }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }
        
        .filter-group label {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-lg);
            cursor: pointer;
            font-size: var(--text-sm);
            color: var(--gray-700);
            transition: var(--transition-all);
        }
        
        .filter-group label:hover { background: var(--primary-50); color: var(--primary-700); }
        
        .filter-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-600);
        }
        
        .filter-group .count {
            margin-left: auto;
            color: var(--gray-500);
            font-size: var(--text-xs);
            background: var(--gray-100);
            padding: 0.1rem 0.5rem;
            border-radius: var(--radius-full);
        }
        
        /* Price Range */
        .price-range { padding: var(--space-2) 0; }
        .price-slider { margin: var(--space-4) 0; }
        
        .price-inputs {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-top: var(--space-4);
        }
        
        .price-inputs input {
            flex: 1;
            padding: var(--space-2);
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            text-align: center;
        }
        
        .noUi-target { height: 6px; border: none; background: var(--gray-200); border-radius: var(--radius-full); }
        .noUi-connect { background: linear-gradient(90deg, var(--primary-500), var(--primary-700)); }
        .noUi-handle {
            width: 20px !important;
            height: 20px !important;
            border-radius: 50% !important;
            background: white;
            border: 2px solid var(--primary-600);
            top: -7px !important;
            cursor: pointer;
        }
        .noUi-handle::before,
        .noUi-handle::after { display: none; }
        
        .rating-stars { display: flex; gap: 2px; color: var(--gold-500); }
        
        .filter-actions {
            margin-top: var(--space-6);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-3) var(--space-6);
            font-size: var(--text-sm);
            font-weight: var(--font-semibold);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: var(--transition-all);
            border: 1px solid transparent;
            gap: var(--space-2);
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
            color: white;
        }
        
        .btn-outline-secondary {
            background: white;
            border: 1px solid var(--gray-300);
            color: var(--gray-700);
        }
        
        .btn-block { width: 100%; }
        
        /* Shop Toolbar */
        .shop-toolbar {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--space-4) var(--space-6);
            margin-bottom: var(--space-6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: var(--space-4);
            box-shadow: var(--shadow-sm);
        }
        
        .results-count { font-size: var(--text-sm); color: var(--gray-600); }
        
        .sort-by {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }
        
        .sort-by select {
            padding: var(--space-2) var(--space-8) var(--space-2) var(--space-4);
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-lg);
            font-size: var(--text-sm);
            background: white;
            cursor: pointer;
        }
        
        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-8);
            margin-bottom: var(--space-8);
        }
        
        .product-card {
            background: white;
            border-radius: var(--radius-2xl);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            transition: var(--transition-all);
            border: 1px solid var(--gray-200);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            position: relative;
        }
        
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-2xl);
        }
        
        .product-badge {
            position: absolute;
            top: var(--space-4);
            left: var(--space-4);
            padding: var(--space-1) var(--space-3);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: var(--font-bold);
            z-index: 10;
        }
        
        .product-badge.sale { background: var(--danger-500); color: white; }
        .product-badge.new { background: var(--success-500); color: white; }
        
        .product-image {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: var(--gray-100);
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .product-actions {
            position: absolute;
            top: var(--space-4);
            right: var(--space-4);
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            z-index: 10;
            opacity: 0;
            transform: translateX(20px);
            transition: var(--transition-all);
        }
        
        .product-card:hover .product-actions {
            opacity: 1;
            transform: translateX(0);
        }
        
        .wishlist-btn, .quick-view-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: white;
            border: none;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-lg);
            transition: var(--transition-all);
        }
        
        .wishlist-btn { color: var(--danger-500); }
        .wishlist-btn:hover { background: var(--danger-500); color: white; }
        .wishlist-btn.active { background: var(--danger-500); color: white; }
        .quick-view-btn { color: var(--primary-600); }
        .quick-view-btn:hover { background: var(--primary-600); color: white; }
        
        .product-info {
            padding: var(--space-8);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .product-category {
            font-size: var(--text-xs);
            color: var(--primary-600);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: var(--space-2);
        }
        
        .product-title {
            font-size: var(--text-3xl);
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: var(--space-3);
        }
        
        .product-rating {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
        }
        
        .rating-count {
            font-size: var(--text-sm);
            color: var(--gray-500);
            background: var(--gray-100);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-full);
        }
        
        .product-price {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
            flex-wrap: wrap;
        }
        
        .compare-price {
            font-size: var(--text-lg);
            color: var(--gray-500);
            text-decoration: line-through;
        }
        
        .current-price {
            font-size: var(--text-4xl);
            font-weight: var(--font-bold);
            color: var(--primary-700);
        }
        
        .discount-badge {
            background: var(--success-500);
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: var(--radius-full);
            font-size: var(--text-sm);
            font-weight: var(--font-bold);
        }
        
        .product-description {
            font-size: var(--text-base);
            color: var(--gray-600);
            margin-bottom: var(--space-6);
        }
        
        .product-actions-bottom {
            display: flex;
            gap: var(--space-4);
            margin-top: var(--space-2);
        }
        
        .view-details-btn {
            flex: 1;
            padding: var(--space-4) var(--space-6);
            background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
            color: white;
            border: none;
            border-radius: var(--radius-xl);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
        }
        
        .amazon-btn {
            flex: 1;
            padding: var(--space-4) var(--space-6);
            background: #ff9900;
            color: #232f3e;
            border: none;
            border-radius: var(--radius-xl);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            text-decoration: none;
        }
        
        /* Pagination */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            margin-top: var(--space-8);
        }
        
        .page-link {
            min-width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            color: var(--gray-700);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-all);
        }
        
        .page-link.active {
            background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
            color: white;
            border-color: var(--primary-600);
        }
        
        .page-link:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Quick View Modal */
        .quick-view-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: var(--z-modal);
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .quick-view-modal.active { display: flex; }
        
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }
        
        .modal-content {
            position: relative;
            background: white;
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-2xl);
            z-index: calc(var(--z-modal) + 1);
            overflow: hidden;
        }
        
        .modal-close {
            position: absolute;
            top: var(--space-4);
            right: var(--space-4);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: white;
            border: none;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        .modal-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-6);
            padding: var(--space-8);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        /* Video Indicator */
        .video-indicator {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 15;
        }
        
        .video-indicator i { color: white; font-size: 18px; }
        
        /* Footer */
        .site-footer {
            background: var(--gray-900);
            color: white;
            padding: var(--space-16) 0 var(--space-8);
            margin-top: auto;
        }
        
        .footer-content {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-8);
            margin-bottom: var(--space-8);
        }
        
        .footer-bottom {
            text-align: center;
            padding-top: var(--space-8);
            border-top: 1px solid var(--gray-800);
            color: var(--gray-500);
        }
        
        /* Loading Spinner */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--gray-200);
            border-top-color: var(--primary-600);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: var(--space-8) auto;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .no-products {
            grid-column: 1 / -1;
            text-align: center;
            padding: var(--space-16);
            background: white;
            border-radius: var(--radius-2xl);
        }
        
        .no-products i { font-size: 4rem; color: var(--gray-300); margin-bottom: var(--space-4); }
        
        /* Mobile Filter Toggle */
        .mobile-filter-toggle {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
            color: white;
            border: none;
            border-radius: var(--radius-full);
            padding: 1rem 1.5rem;
            box-shadow: var(--shadow-2xl);
            cursor: pointer;
            font-weight: var(--font-semibold);
            gap: 0.5rem;
            align-items: center;
            z-index: 99;
        }
        
        .filter-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        
        @media (max-width: 768px) {
            .shop-layout { grid-template-columns: 1fr; }
            .shop-sidebar { position: fixed; top: 0; left: -100%; width: 300px; height: 100vh; z-index: 1000; transition: left 0.3s; }
            .shop-sidebar.active { left: 0; }
            .mobile-filter-toggle { display: flex; }
            .filter-overlay.active { display: block; }
            .nav-menu { display: none; }
            .nav-menu.active { display: flex; flex-direction: column; position: absolute; top: 80px; left: 0; right: 0; background: white; padding: 1rem; }
            .mobile-menu-toggle { display: block; }
            .product-card { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 480px) {
            .modal-body { grid-template-columns: 1fr; }
            .product-actions-bottom { flex-direction: column; }
        }
        
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .video-modal.active { display: flex; }

    <button class="mobile-filter-toggle" id="mobileFilterToggle">

    <div class="filter-overlay" id="filterOverlay"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- ALL FIREBASE CODE IN ONE MODULE - NO DEMO PRODUCTS -->
    <script type="module">
        // Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, deleteDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDT7EwNMmgfyOJa-uMVcXW3TWmNNHApkus",
            authDomain: "sb-store-719d5.firebaseapp.com",
            projectId: "sb-store-719d5",
            storageBucket: "sb-store-719d5.firebasestorage.app",
            messagingSenderId: "501493533680",
            appId: "1:501493533680:web:7b1409406b95006df62b35"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        console.log('✅ Firebase initialized successfully');
        
        // ========== CONFIGURATION ==========
        const CONFIG = {
            productsPerPage: 10,
            defaultImage: 'https://via.placeholder.com/600x600?text=No+Image',
            maxDescriptionLength: 120
        };
        
        // ========== STATE ==========
        const State = {
            products: [],
            filteredProducts: [],
            currentPage: 1,
            productsPerPage: CONFIG.productsPerPage,
            currentProduct: null,
            wishlist: [],
            filters: {
                categories: [],
                brands: [],
                ratings: [],
                availability: [],
                features: [],
                minPrice: 0,
                maxPrice: 100000
            },
            sortBy: 'newest',
            userId: null
        };
        
        // ========== UTILITIES ==========
        const Utils = {
            formatPrice(price) {
                return new Intl.NumberFormat('en-IN', {
                    style: 'currency',
                    currency: 'INR',
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                }).format(price);
            },
            
            truncateText(text, maxLength) {
                if (!text) return '';
                return text.length <= maxLength ? text : text.substr(0, maxLength).trim() + '...';
            },
            
            getValidImage(product) {
                if (!product) return CONFIG.defaultImage;
                if (product.imageUrl && product.imageUrl.trim()) return product.imageUrl;
                if (product.image && product.image.trim()) return product.image;
                return CONFIG.defaultImage;
            },
            
            generateStars(rating) {
                const full = Math.floor(rating);
                const half = rating % 1 >= 0.5;
                let stars = '';
                for (let i = 0; i < full; i++) stars += '<i class="fas fa-star"></i>';
                if (half) stars += '<i class="fas fa-star-half-alt"></i>';
                for (let i = 0; i < 5 - Math.ceil(rating); i++) stars += '<i class="far fa-star"></i>';
                return stars;
            },
            
            generateUserId() {
                let userId = localStorage.getItem('sb_user_id');
                if (!userId) {
                    userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('sb_user_id', userId);
                }
                return userId;
            },
            
            showNotification(message, type = 'success', title = null) {
                toastr.options = { closeButton: true, progressBar: true, timeOut: 3000 };
                if (type === 'success') toastr.success(message, title || 'Success');
                else if (type === 'error') toastr.error(message, title || 'Error');
                else toastr.info(message, title || 'Info');
            }
        };
        
        // ========== FIREBASE DATA MANAGER - NO DEMO PRODUCTS ==========
        const FirebaseManager = {
            async loadProducts() {
                try {
                    console.log('📦 Loading products from Firebase...');
                    const productsRef = collection(db, 'products');
                    const q = query(productsRef, orderBy('createdAt', 'desc'));
                    const querySnapshot = await getDocs(q);
                    
                    console.log(`📊 Found ${querySnapshot.size} products in Firebase`);
                    
                    if (querySnapshot.empty) {
                        console.log('⚠️ No products found in Firebase');
                        Utils.showNotification('No products available. Please add products from admin panel.', 'info');
                        State.products = [];
                        State.filteredProducts = [];
                        ProductRenderer.render();
                        return false;
                    }
                    
                    const products = [];
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        products.push({
                            id: doc.id,
                            name: data.name || 'Unnamed Product',
                            comparePrice: data.comparePrice || data.originalPrice || data.price || 0,
                            currentPrice: data.currentPrice || data.salePrice || data.price || 0,
                            discountPercent: data.discountPercent || '',
                            image: data.imageUrl || data.image || CONFIG.defaultImage,
                            category: data.category || 'Uncategorized',
                            brand: data.brand || 'Generic',
                            rating: data.rating || 4.5,
                            reviews: data.reviews || Math.floor(Math.random() * 100) + 10,
                            stock: data.stock !== undefined ? data.stock : 100,
                            freeShipping: data.freeShipping || false,
                            featured: data.featured || false,
                            isNew: data.isNew || false,
                            description: data.description || 'No description available.',
                            amazonUrl: data.amazonUrl || '#',
                            videoUrl: data.videoUrl || ''
                        });
                    });
                    
                    State.products = products;
                    State.filteredProducts = [...State.products];
                    
                    console.log(`✅ Successfully loaded ${State.products.length} products from Firebase`);
                    Utils.showNotification(`Loaded ${State.products.length} products`, 'success');
                    return true;
                } catch (error) {
                    console.error('❌ Error loading products:', error);
                    Utils.showNotification('Failed to load products. Check console for details.', 'error');
                    State.products = [];
                    State.filteredProducts = [];
                    ProductRenderer.render();
                    return false;
                }
            },
            
            async loadWishlist() {
                State.userId = Utils.generateUserId();
                try {
                    const wishlistRef = doc(db, 'wishlists', State.userId);
                    const docSnap = await getDoc(wishlistRef);
                    if (docSnap.exists()) {
                        State.wishlist = docSnap.data().products || [];
                    } else {
                        State.wishlist = [];
                    }
                    console.log(`💖 Wishlist loaded: ${State.wishlist.length} items`);
                } catch (error) {
                    console.error('Error loading wishlist:', error);
                    State.wishlist = [];
                }
                this.updateWishlistCount();
            },
            
            async saveWishlist() {
                if (!State.userId) return;
                try {
                    const wishlistRef = doc(db, 'wishlists', State.userId);
                    await setDoc(wishlistRef, { products: State.wishlist, updatedAt: new Date() });
                    this.updateWishlistCount();
                } catch (error) {
                    console.error('Error saving wishlist:', error);
                }
            },
            
            updateWishlistCount() {
                const el = document.getElementById('wishlistCount');
                if (el) {
                    el.textContent = State.wishlist.length;
                    el.style.display = State.wishlist.length ? 'flex' : 'none';
                }
            },
            
            updateCartCount() {
                const el = document.getElementById('cartCount');
                if (el) el.textContent = '0';
            }
        };
        
        // ========== FILTER MANAGER ==========
        const FilterManager = {
            init() {
                this.initPriceSlider();
                this.updateFilterCounts();
                this.setupEventListeners();
            },
            
            initPriceSlider() {
                const slider = document.getElementById('priceSlider');
                const minInput = document.getElementById('minPrice');
                const maxInput = document.getElementById('maxPrice');
                if (!slider || !minInput || !maxInput || typeof noUiSlider === 'undefined') return;
                
                noUiSlider.create(slider, {
                    start: [0, 100000],
                    connect: true,
                    range: { min: 0, max: 100000 },
                    step: 100
                });
                
                slider.noUiSlider.on('update', (values) => {
                    minInput.value = Math.round(values[0]);
                    maxInput.value = Math.round(values[1]);
                    State.filters.minPrice = Math.round(values[0]);
                    State.filters.maxPrice = Math.round(values[1]);
                });
                
                minInput.addEventListener('change', () => slider.noUiSlider.set([minInput.value, null]));
                maxInput.addEventListener('change', () => slider.noUiSlider.set([null, maxInput.value]));
            },
            
            updateFilterCounts() {
                const catCounts = {};
                State.products.forEach(p => catCounts[p.category] = (catCounts[p.category] || 0) + 1);
                const catEl = document.getElementById('categoryFilters');
                if (catEl && Object.keys(catCounts).length > 0) {
                    catEl.innerHTML = Object.keys(catCounts).sort().map(cat => `
                        <label><input type="checkbox" value="${cat}"> ${cat} <span class="count">${catCounts[cat]}</span></label>
                    `).join('');
                }
                
                const brandCounts = {};
                State.products.forEach(p => { if (p.brand) brandCounts[p.brand] = (brandCounts[p.brand] || 0) + 1; });
                const brandEl = document.getElementById('brandFilters');
                if (brandEl && Object.keys(brandCounts).length > 0) {
                    brandEl.innerHTML = Object.keys(brandCounts).sort().map(brand => `
                        <label><input type="checkbox" value="${brand}"> ${brand} <span class="count">${brandCounts[brand]}</span></label>
                    `).join('');
                }
                
                document.getElementById('ratingFilters').innerHTML = `
                    <label><input type="checkbox" value="4"> <span class="rating-stars">★★★★☆</span> & above <span class="count">${State.products.filter(p => p.rating >= 4).length}</span></label>
                    <label><input type="checkbox" value="3"> <span class="rating-stars">★★★☆☆</span> & above <span class="count">${State.products.filter(p => p.rating >= 3 && p.rating < 4).length}</span></label>
                `;
                
                document.getElementById('inStockCount').textContent = State.products.filter(p => p.stock > 0).length;
                document.getElementById('outOfStockCount').textContent = State.products.filter(p => p.stock <= 0).length;
                document.getElementById('freeShippingCount').textContent = State.products.filter(p => p.freeShipping).length;
                document.getElementById('featuredCount').textContent = State.products.filter(p => p.featured).length;
                document.getElementById('newCount').textContent = State.products.filter(p => p.isNew).length;
            },
            
            applyFilters() {
                State.filters.categories = Array.from(document.querySelectorAll('#categoryFilters input:checked')).map(cb => cb.value);
                State.filters.brands = Array.from(document.querySelectorAll('#brandFilters input:checked')).map(cb => cb.value);
                State.filters.ratings = Array.from(document.querySelectorAll('#ratingFilters input:checked')).map(cb => parseFloat(cb.value));
                const availability = Array.from(document.querySelectorAll('#availabilityFilters input:checked')).map(cb => cb.value);
                const features = Array.from(document.querySelectorAll('#featureFilters input:checked')).map(cb => cb.value);
                const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
                const maxPrice = parseFloat(document.getElementById('maxPrice').value) || 100000;
                
                State.filteredProducts = State.products.filter(p => {
                    if (State.filters.categories.length && !State.filters.categories.includes(p.category)) return false;
                    if (State.filters.brands.length && !State.filters.brands.includes(p.brand)) return false;
                    if (State.filters.ratings.length) {
                        const pr = Math.floor(p.rating);
                        if (!State.filters.ratings.some(r => pr >= r)) return false;
                    }
                    if (availability.includes('in-stock') && p.stock <= 0) return false;
                    if (availability.includes('out-of-stock') && p.stock > 0) return false;
                    if (availability.includes('free-shipping') && !p.freeShipping) return false;
                    if (features.includes('featured') && !p.featured) return false;
                    if (features.includes('new') && !p.isNew) return false;
                    return p.currentPrice >= minPrice && p.currentPrice <= maxPrice;
                });
                
                this.applySorting();
                State.currentPage = 1;
                ProductRenderer.render();
                Utils.showNotification('Filters applied', 'success');
            },
            
            applySorting() {
                const sort = document.getElementById('sortBy')?.value || State.sortBy;
                switch(sort) {
                    case 'price-low':
                        State.filteredProducts.sort((a, b) => a.currentPrice - b.currentPrice);
                        break;
                    case 'price-high':
                        State.filteredProducts.sort((a, b) => b.currentPrice - a.currentPrice);
                        break;
                    case 'rating':
                        State.filteredProducts.sort((a, b) => b.rating - a.rating);
                        break;
                    case 'name-asc':
                        State.filteredProducts.sort((a, b) => a.name.localeCompare(b.name));
                        break;
                    default:
                        State.filteredProducts.sort((a, b) => b.id.localeCompare(a.id));
                        break;
                }
            },
            
            clearFilters() {
                document.querySelectorAll('.filter-group input[type="checkbox"]').forEach(cb => cb.checked = false);
                const slider = document.getElementById('priceSlider');
                if (slider && slider.noUiSlider) slider.noUiSlider.set([0, 100000]);
                State.filteredProducts = [...State.products];
                State.currentPage = 1;
                ProductRenderer.render();
                Utils.showNotification('All filters cleared', 'info');
            },
            
            setupEventListeners() {
                document.getElementById('applyFilters')?.addEventListener('click', () => this.applyFilters());
                document.getElementById('clearFilters')?.addEventListener('click', () => this.clearFilters());
                document.getElementById('sortBy')?.addEventListener('change', () => {
                    this.applySorting();
                    ProductRenderer.render();
                });
            }
        };
        
        // ========== PRODUCT RENDERER ==========
        const ProductRenderer = {
            render() {
                const grid = document.getElementById('shopProductsGrid');
                if (!grid) return;
                
                if (State.filteredProducts.length === 0) {
                    grid.innerHTML = `
                        <div class="no-products">
                            <i class="fas fa-box-open"></i>
                            <h3>No Products Found</h3>
                            <p>${State.products.length === 0 ? 'No products in the database. Please add products from admin panel.' : 'Try adjusting your filters.'}</p>
                        </div>
                    `;
                    Pagination.update(0);
                    this.updateResultsCount(0);
                    return;
                }
                
                const start = (State.currentPage - 1) * State.productsPerPage;
                const end = start + State.productsPerPage;
                const pageProducts = State.filteredProducts.slice(start, end);
                
                grid.innerHTML = pageProducts.map(p => this.renderProductCard(p)).join('');
                this.updateResultsCount(State.filteredProducts.length);
                Pagination.update(State.filteredProducts.length);
            },
            
            renderProductCard(product) {
                const inWishlist = State.wishlist.includes(product.id);
                const hasDiscount = product.comparePrice && product.comparePrice > product.currentPrice;
                const hasVideo = product.videoUrl && product.videoUrl.trim() !== '';
                
                return `
                    <div class="product-card" data-product-id="${product.id}">
                        ${product.isNew ? '<div class="product-badge new">New</div>' : ''}
                        ${hasDiscount && product.discountPercent ? `<div class="product-badge sale">-${product.discountPercent}%</div>` : ''}
                        
                        <div class="product-image">
                            <img src="${Utils.getValidImage(product)}" alt="${product.name}" loading="lazy">
                            <div class="product-actions">
                                <button class="wishlist-btn ${inWishlist ? 'active' : ''}" onclick="window.toggleWishlist('${product.id}', event)">
                                    <i class="${inWishlist ? 'fas' : 'far'} fa-heart"></i>
                                </button>
                                <button class="quick-view-btn" onclick="window.openQuickView('${product.id}')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            ${hasVideo ? `
                                <div class="video-indicator" onclick="event.stopPropagation(); window.playVideo('${product.videoUrl}')">
                                    <i class="fas fa-play"></i>
                                </div>
                            ` : ''}
                        </div>
                        
                        <div class="product-info">
                            <div class="product-category">${product.category}</div>
                            <h3 class="product-title">${product.name}</h3>
                            
                            <div class="product-rating">
                                <div class="rating-stars">${Utils.generateStars(product.rating)}</div>
                                <span class="rating-count">(${product.reviews})</span>
                            </div>
                            
                            <div class="product-price">
                                ${hasDiscount ? `<span class="compare-price">${Utils.formatPrice(product.comparePrice)}</span>` : ''}
                                <span class="current-price">${Utils.formatPrice(product.currentPrice)}</span>
                                ${hasDiscount && product.discountPercent ? `<span class="discount-badge">-${product.discountPercent}%</span>` : ''}
                            </div>
                            
                            <p class="product-description">${Utils.truncateText(product.description, CONFIG.maxDescriptionLength)}</p>
                            
                            <div class="product-actions-bottom">
                                <a href="${product.amazonUrl}" class="amazon-btn" target="_blank">
                                    Buy Now
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            },
            
            updateResultsCount(count) {
                const el = document.getElementById('resultsCount');
                if (el) {
                    const showing = Math.min(CONFIG.productsPerPage, count);
                    el.innerHTML = `<i class="fas fa-box"></i> Showing <strong>${showing}</strong> of <strong>${count}</strong> results`;
                }
            }
        };
        
        // ========== PAGINATION ==========
        const Pagination = {
            update(totalItems) {
                const numEl = document.getElementById('paginationNumbers');
                const prev = document.querySelector('.page-link.prev');
                const next = document.querySelector('.page-link.next');
                if (!numEl) return;
                
                const totalPages = Math.ceil(totalItems / State.productsPerPage);
                if (totalPages <= 1) {
                    numEl.innerHTML = '';
                    if (prev) prev.disabled = true;
                    if (next) next.disabled = true;
                    return;
                }
                
                if (prev) prev.disabled = State.currentPage === 1;
                if (next) next.disabled = State.currentPage === totalPages;
                
                let html = '';
                for (let i = 1; i <= totalPages; i++) {
                    if (i === 1 || i === totalPages || (i >= State.currentPage - 2 && i <= State.currentPage + 2)) {
                        html += `<button class="page-link ${i === State.currentPage ? 'active' : ''}" onclick="window.goToPage(${i})">${i}</button>`;
                    } else if (i === State.currentPage - 3 || i === State.currentPage + 3) {
                        html += '<span class="page-dots">...</span>';
                    }
                }
                numEl.innerHTML = html;
            },
            
            goToPage(page) {
                State.currentPage = page;
                ProductRenderer.render();
                document.querySelector('.shop-main')?.scrollIntoView({ behavior: 'smooth' });
            }
        };
        
        // ========== WISHLIST SYSTEM ==========
        const WishlistSystem = {
            async toggle(productId, event) {
                if (event) event.stopPropagation();
                const product = State.products.find(p => p.id === productId);
                if (!product) return;
                
                const idx = State.wishlist.indexOf(productId);
                if (idx === -1) {
                    State.wishlist.push(productId);
                    Utils.showNotification(`${product.name} added to wishlist`, 'success');
                } else {
                    State.wishlist.splice(idx, 1);
                    Utils.showNotification(`${product.name} removed from wishlist`, 'info');
                }
                await FirebaseManager.saveWishlist();
                
                document.querySelectorAll(`.product-card[data-product-id="${productId}"] .wishlist-btn`).forEach(btn => {
                    const icon = btn.querySelector('i');
                    const inWish = State.wishlist.includes(productId);
                    if (icon) {
                        icon.className = inWish ? 'fas fa-heart' : 'far fa-heart';
                        btn.classList.toggle('active', inWish);
                    }
                });
            }
        };
        
        // ========== QUICK VIEW MANAGER ==========
        const QuickViewManager = {
            open(productId) {
                const modal = document.getElementById('quickViewModal');
                const product = State.products.find(p => p.id === productId);
                if (!modal || !product) return;
                
                const hasDiscount = product.comparePrice && product.comparePrice > product.currentPrice;
                
                document.getElementById('quickViewImage').src = Utils.getValidImage(product);
                document.getElementById('quickViewTitle').textContent = product.name;
                document.getElementById('quickViewRating').innerHTML = `<div class="rating-stars">${Utils.generateStars(product.rating)}</div> <span>(${product.reviews} reviews)</span>`;
                
                let priceHtml = `${Utils.formatPrice(product.currentPrice)}`;
                if (hasDiscount) {
                    priceHtml = `<span style="text-decoration:line-through;">${Utils.formatPrice(product.comparePrice)}</span> ${priceHtml}`;
                }
                document.getElementById('quickViewPrice').innerHTML = priceHtml;
                document.getElementById('quickViewDescription').textContent = product.description;
                document.getElementById('quickViewAmazonBtn').href = product.amazonUrl;
                
                const inWish = State.wishlist.includes(product.id);
                const wlBtn = document.getElementById('quickViewWishlistBtn');
                wlBtn.innerHTML = inWish ? '<i class="fas fa-heart"></i> In Wishlist' : '<i class="far fa-heart"></i> Add to Wishlist';
                wlBtn.onclick = () => WishlistSystem.toggle(product.id);
                
                modal.classList.add('active');
            },
            
            close() {
                document.getElementById('quickViewModal')?.classList.remove('active');
            }
        };
        
        // ========== VIDEO MANAGER ==========
        const VideoManager = {
            playVideo(videoUrl) {
                if (!videoUrl) {
                    Utils.showNotification('No video available', 'error');
                    return;
                }
                
                let embedUrl = videoUrl;
                const youtubeMatch = videoUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/);
                if (youtubeMatch) {
                    embedUrl = `https://www.youtube.com/embed/${youtubeMatch[1]}?autoplay=1`;
                }
                
                const modal = document.createElement('div');
                modal.className = 'video-modal';
                modal.innerHTML = `
                    <div class="video-modal-overlay" onclick="this.parentElement.remove()"></div>
                    <div class="video-modal-content">
                        <button class="video-modal-close" onclick="this.closest('.video-modal').remove()">&times;</button>
                        ${youtubeMatch ? `<iframe src="${embedUrl}" frameborder="0" allow="autoplay" allowfullscreen></iframe>` : `<video controls autoplay src="${videoUrl}"></video>`}
                    </div>
                `;
                document.body.appendChild(modal);
                modal.classList.add('active');
            }
        };
        
        // ========== MOBILE MENU MANAGER ==========
        const MobileMenuManager = {
            init() {
                const mobileToggle = document.getElementById('mobileMenuToggle');
                const navMenu = document.querySelector('.nav-menu');
                const filterToggle = document.getElementById('mobileFilterToggle');
                const sidebar = document.getElementById('shopSidebar');
                const overlay = document.getElementById('filterOverlay');
                
                mobileToggle?.addEventListener('click', () => navMenu?.classList.toggle('active'));
                filterToggle?.addEventListener('click', () => {
                    sidebar?.classList.add('active');
                    overlay?.classList.add('active');
                });
                overlay?.addEventListener('click', () => {
                    sidebar?.classList.remove('active');
                    overlay?.classList.remove('active');
                });
            }
        };
        
        // Make functions global for onclick handlers
        window.toggleWishlist = (id, e) => WishlistSystem.toggle(id, e);
        window.openQuickView = (id) => QuickViewManager.open(id);
        window.goToPage = (page) => Pagination.goToPage(page);
        window.playVideo = (url) => VideoManager.playVideo(url);
        
        // ========== APP INITIALIZATION ==========
        async function init() {
            console.log('🚀 Initializing SB Store...');
            await FirebaseManager.loadProducts();
            await FirebaseManager.loadWishlist();
            FilterManager.init();
            MobileMenuManager.init();
            ProductRenderer.render();
            AOS.init({ duration: 800, once: true });
            
            document.querySelector('.modal-overlay')?.addEventListener('click', () => QuickViewManager.close());
            document.querySelector('.modal-close')?.addEventListener('click', () => QuickViewManager.close());
            
            document.querySelector('.page-link.prev')?.addEventListener('click', () => {
                if (State.currentPage > 1) Pagination.goToPage(State.currentPage - 1);
            });
            document.querySelector('.page-link.next')?.addEventListener('click', () => {
                const totalPages = Math.ceil(State.filteredProducts.length / State.productsPerPage);
                if (State.currentPage < totalPages) Pagination.goToPage(State.currentPage + 1);
            });
            
            console.log('✅ SB Store ready!');
        }
        
        init();
    </script>
</body>
</html>
