<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Test - SB Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { 
            background: #f5f5f5; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 10px;
        }
        button { 
            padding: 10px 20px; 
            margin: 5px; 
            cursor: pointer; 
            background: #667eea; 
            color: white; 
            border: none; 
            border-radius: 5px; 
        }
        .success { color: green; }
        .error { color: red; }
        pre { background: #333; color: #fff; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🔧 Account System Test Page</h1>
    
    <div class="test-section">
        <h2>Step 1: Account Elements Test</h2>
        <div id="accountElements" style="border: 2px solid #667eea; padding: 20px; margin: 10px 0;">
            <!-- This is the EXACT HTML your site needs -->
            <div class="account-container" style="position: relative; display: inline-block;">
                <a href="#" id="accountIcon" style="text-decoration: none; color: #333; padding: 10px; background: #f0f0f0; border-radius: 5px;">
                    👤 Account
                </a>
                
                <div id="accountDropdown" style="position: absolute; top: 100%; left: 0; width: 200px; background: white; border: 1px solid #ddd; border-radius: 5px; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                    <div id="accountHeader" style="padding: 10px; border-bottom: 1px solid #ddd;">
                        <strong>Welcome!</strong>
                    </div>
                    <div id="accountBody" style="padding: 10px;">
                        <a href="#" style="display: block; padding: 5px; color: #333; text-decoration: none;">Login</a>
                        <a href="#" style="display: block; padding: 5px; color: #333; text-decoration: none;">Register</a>
                    </div>
                </div>
            </div>
        </div>
        <button onclick="testElements()">Test Elements</button>
        <button onclick="toggleDropdown()">Toggle Dropdown</button>
        <button onclick="simulateLogin()">Simulate Login</button>
        <button onclick="simulateLogout()">Simulate Logout</button>
        <div id="elementResult"></div>
    </div>

    <div class="test-section">
        <h2>Step 2: Storage Test</h2>
        <button onclick="checkStorage()">Check Storage</button>
        <button onclick="clearStorage()">Clear Storage</button>
        <pre id="storageResult">Click check storage</pre>
    </div>

    <div class="test-section">
        <h2>Step 3: Manual Account System</h2>
        <p>Use these buttons to test functionality:</p>
        <button onclick="manualLogin()">Manual Login</button>
        <button onclick="manualLogout()">Manual Logout</button>
        <div id="manualResult"></div>
    </div>

    <script>
        // ========== TEST FUNCTIONS ==========
        
        function testElements() {
            const icon = document.getElementById('accountIcon');
            const dropdown = document.getElementById('accountDropdown');
            const header = document.getElementById('accountHeader');
            const body = document.getElementById('accountBody');
            
            let result = '';
            if (icon) result += '✅ accountIcon FOUND\n';
            else result += '❌ accountIcon MISSING\n';
            
            if (dropdown) result += '✅ accountDropdown FOUND\n';
            else result += '❌ accountDropdown MISSING\n';
            
            if (header) result += '✅ accountHeader FOUND\n';
            else result += '❌ accountHeader MISSING\n';
            
            if (body) result += '✅ accountBody FOUND\n';
            else result += '❌ accountBody MISSING\n';
            
            document.getElementById('elementResult').innerText = result;
        }

        function toggleDropdown() {
            const dropdown = document.getElementById('accountDropdown');
            if (dropdown.style.display === 'none' || dropdown.style.display === '') {
                dropdown.style.display = 'block';
            } else {
                dropdown.style.display = 'none';
            }
        }

        function checkStorage() {
            const local = localStorage.getItem('sbstore_current_user');
            const session = sessionStorage.getItem('sbstore_current_user');
            const users = localStorage.getItem('sbstore_users');
            
            document.getElementById('storageResult').innerText = 
                `localStorage user: ${local || 'None'}\n` +
                `sessionStorage user: ${session || 'None'}\n` +
                `All users: ${users || 'None'}`;
        }

        function clearStorage() {
            localStorage.removeItem('sbstore_current_user');
            sessionStorage.removeItem('sbstore_current_user');
            checkStorage();
        }

        function simulateLogin() {
            const user = {
                id: Date.now(),
                name: 'Test User',
                email: 'test@example.com'
            };
            localStorage.setItem('sbstore_current_user', JSON.stringify(user));
            updateUIForLogin(user);
            checkStorage();
        }

        function simulateLogout() {
            localStorage.removeItem('sbstore_current_user');
            sessionStorage.removeItem('sbstore_current_user');
            updateUIForLogout();
            checkStorage();
        }

        function updateUIForLogin(user) {
            const header = document.getElementById('accountHeader');
            const body = document.getElementById('accountBody');
            
            if (header) header.innerHTML = `<strong>${user.name}</strong>`;
            if (body) {
                body.innerHTML = `
                    <a href="#" style="display: block; padding: 5px;">Dashboard</a>
                    <a href="#" style="display: block; padding: 5px;">Profile</a>
                    <a href="#" style="display: block; padding: 5px;" onclick="simulateLogout()">Logout</a>
                `;
            }
            document.getElementById('manualResult').innerHTML = '<span class="success">✅ Logged in as ' + user.name + '</span>';
        }

        function updateUIForLogout() {
            const header = document.getElementById('accountHeader');
            const body = document.getElementById('accountBody');
            
            if (header) header.innerHTML = '<strong>Welcome!</strong>';
            if (body) {
                body.innerHTML = `
                    <a href="#" style="display: block; padding: 5px;">Login</a>
                    <a href="#" style="display: block; padding: 5px;">Register</a>
                `;
            }
            document.getElementById('manualResult').innerHTML = '<span class="error">❌ Logged out</span>';
        }

        function manualLogin() {
            simulateLogin();
        }

        function manualLogout() {
            simulateLogout();
        }

        // Setup click handler
        document.getElementById('accountIcon')?.addEventListener('click', function(e) {
            e.preventDefault();
            toggleDropdown();
        });

        // Check initial state
        window.onload = function() {
            testElements();
            checkStorage();
        };
    </script>
</body>
</html>
