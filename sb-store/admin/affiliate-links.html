<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate Links - SB Store Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <!-- Same sidebar -->
        </aside>

        <main class="admin-main">
            <div class="admin-top-header">
                <!-- Same header -->
            </div>

            <div class="page-header">
                <h1>Affiliate Links Manager</h1>
                <div class="page-actions">
                    <button class="btn btn-outline" onclick="testAllLinks()">
                        <i class="fas fa-check-circle"></i> Test Links
                    </button>
                    <button class="btn btn-primary" onclick="bulkUpdate()">
                        <i class="fas fa-sync-alt"></i> Bulk Update
                    </button>
                </div>
            </div>

            <div class="table-container">
                <table id="linksTable">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Amazon Link</th>
                            <th>Tag Status</th>
                            <th>Clicks</th>
                            <th>Last Click</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="linksTableBody">
                        <!-- Will be populated -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
